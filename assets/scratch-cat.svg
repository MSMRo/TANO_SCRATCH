<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="catBody" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFBD38"/>
      <stop offset="100%" stop-color="#F29300"/>
    </radialGradient>
    <linearGradient id="earInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A8A"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
  </defs>

  <!-- Tail -->
  <path d="M22 68 C12 60, 5 45, 12 36 C18 28, 26 38, 22 52 C20 58, 21 64, 25 68 Z" fill="url(#catBody)" stroke="#2C1B00" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Body -->
  <path d="M26 62 C26 48, 40 44, 52 46 C64 48, 70 58, 70 68 C70 80, 55 86, 40 85 C28 84, 26 74, 26 62 Z" fill="url(#catBody)" stroke="#2C1B00" stroke-width="2.5"/>

  <!-- Back Leg / Foot -->
  <ellipse cx="32" cy="84" rx="10" ry="6" fill="url(#catBody)" stroke="#2C1B00" stroke-width="2.5"/>
  <ellipse cx="62" cy="84" rx="10" ry="6" fill="url(#catBody)" stroke="#2C1B00" stroke-width="2.5"/>

  <!-- White Chest / Tummy -->
  <path d="M42 56 C46 56, 52 62, 52 72 C52 79, 44 82, 38 80 C34 76, 36 62, 42 56 Z" fill="#FFFFFF"/>

  <!-- Head Outline & Fill -->
  <path d="M50 20 L58 4 C60 2, 65 5, 64 12 L65 18 C74 20, 84 28, 85 40 C86 52, 74 62, 60 62 C46 62, 36 50, 36 38 C36 28, 44 21, 50 20 Z" fill="url(#catBody)" stroke="#2C1B00" stroke-width="2.5"/>

  <!-- Left Ear (front) -->
  <polygon points="50,20 44,4 54,14" fill="url(#catBody)" stroke="#2C1B00" stroke-width="2"/>
  <polygon points="49,18 46,7 52,14" fill="url(#earInner)"/>

  <!-- Right Ear -->
  <polygon points="62,15 68,5 72,17" fill="url(#earInner)"/>

  <!-- Eyes -->
  <ellipse cx="58" cy="34" rx="6.5" ry="9" fill="#FFFFFF" stroke="#2C1B00" stroke-width="2"/>
  <ellipse cx="59.5" cy="34" rx="3.5" ry="5.5" fill="#2C1B00"/>
  <circle cx="58.5" cy="32" r="1.5" fill="#FFFFFF"/>

  <ellipse cx="73" cy="35" rx="6.5" ry="9" fill="#FFFFFF" stroke="#2C1B00" stroke-width="2"/>
  <ellipse cx="74.5" cy="35" rx="3.5" ry="5.5" fill="#2C1B00"/>
  <circle cx="73.5" cy="33" r="1.5" fill="#FFFFFF"/>

  <!-- Nose -->
  <polygon points="67,42 64,46 70,46" fill="#2C1B00"/>

  <!-- Mouth -->
  <path d="M64 47 C64 51, 67 52, 67 49 C67 52, 70 51, 70 47" fill="none" stroke="#2C1B00" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="72" y1="44" x2="88" y2="42" stroke="#2C1B00" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="73" y1="47" x2="87" y2="48" stroke="#2C1B00" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="60" y1="45" x2="48" y2="43" stroke="#2C1B00" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="60" y1="48" x2="46" y2="49" stroke="#2C1B00" stroke-width="1.8" stroke-linecap="round"/>
</svg>
