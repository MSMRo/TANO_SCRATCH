<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" fill="none">
  <defs>
    <linearGradient id="arduinoTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A29C"/>
      <stop offset="100%" stop-color="#008184"/>
    </linearGradient>
    <linearGradient id="scratchOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFAB19"/>
      <stop offset="100%" stop-color="#FF8C1A"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C4B4"/>
      <stop offset="100%" stop-color="#4C97FF"/>
    </linearGradient>
  </defs>

  <!-- Badge Icon -->
  <rect x="6" y="8" width="48" height="48" rx="14" fill="url(#arduinoTeal)" />
  <rect x="8" y="10" width="44" height="44" rx="12" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <!-- Scratch S + Arduino Motif -->
  <path d="M22 24 C22 18, 38 18, 38 24 C38 30, 22 34, 22 40 C22 46, 38 46, 38 40" 
        stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sparkle indicator -->
  <circle cx="43" cy="18" r="3" fill="#FFE082" />
  <line x1="43" y1="12" x2="43" y2="14" stroke="#FFE082" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="22" x2="43" y2="24" stroke="#FFE082" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="18" x2="39" y2="18" stroke="#FFE082" stroke-width="2" stroke-linecap="round"/>
  <line x1="47" y1="18" x2="49" y2="18" stroke="#FFE082" stroke-width="2" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <text x="64" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="31" letter-spacing="-0.5">
    <tspan fill="url(#accentCyan)">Tano</tspan><tspan fill="url(#scratchOrange)">Scratch</tspan>
  </text>
  
  <!-- Sub-badge -->
  <rect x="250" y="24" width="72" height="18" rx="9" fill="#008184" />
  <text x="286" y="37" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BLE SENSE</text>
</svg>
